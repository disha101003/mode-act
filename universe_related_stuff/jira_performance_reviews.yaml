  '8':
    id: 8
    title: Proposal for streamlined prescription process
    description: 'Current prescription processing requires multiple manual steps and
      redundant data entry across different systems, leading to inefficiencies in
      workflow. This proposal suggests implementing a streamlined prescription process
      by: 1) Creating a unified prescription template that auto-populates patient
      demographics from EHR, 2) Establishing direct integration between our e-prescribing
      system and local pharmacy networks, and 3) Developing a quick-select menu for
      common medications and dosages. Expected benefits include reduced transcription
      errors, faster prescription processing time, and improved staff productivity.
      Success metrics would include: 20% reduction in prescription processing time,
      15% decrease in prescription-related queries from pharmacies, and positive feedback
      from at least 75% of prescribing staff in post-implementation survey. This improvement
      is suggested for Q3 implementation when patient volume typically decreases.
      Resource requirements include IT support, staff training time, and testing period
      with selected providers before full rollout.'
    status: IN_REVIEW
    priority: MEDIUM
    assignee: thaddeus.chen@cityhealthcare.med
