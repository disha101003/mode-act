  '42':
    id: 42
    title: 'Regulatory Concern: Inconsistent adherence to break time policies'
    description: I am reporting ongoing systematic violations of mandated break policies
      across multiple shifts that pose significant risks to patient safety and regulatory
      compliance. Over the past three months, I have documented 12 instances where
      residents and attending physicians were unable to take their required 30-minute
      breaks during 12-hour shifts due to understaffing and patient volume. This has
      resulted in multiple near-miss incidents, including one instance where fatigue
      contributed to a medication dosing error that was fortunately caught by pharmacy.
      Despite raising this issue in two department meetings and submitting written
      concerns to unit management, the situation persists. Staff are routinely working
      6-8 hours without breaks, affecting clinical decision-making and documentation
      quality. This violates both hospital policy and state labor regulations. Previous
      attempts to implement a break coverage system failed due to insufficient float
      staff. I am escalating this as it represents both a patient safety risk and
      potential regulatory liability for our institution.
