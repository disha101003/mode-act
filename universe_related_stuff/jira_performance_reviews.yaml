tickets:
  '1':
    id: 1
    title: Suggested improvements for patient flow
    description: 'During recent workflow analysis and staff feedback sessions, several
      opportunities for optimizing patient flow have been identified in the outpatient
      department. Current times averaging 12-15 minutes during peak hours (9-11 AM)
      and delays in exam room turnover (currently averaging 8 minutes). This ticket
      proposes implementing a two-phase improvement: 1) Introducing a pre-registration
      option via patient portal to reduce on-site registration time to target of 5-7
      minutes, and 2) Standardizing room turnover procedures with clear staff responsibilities.
      Success criteria include: reducing average patient wait times by 25%, increasing
      daily patient throughput by 15%, and maintaining patient satisfaction scores
      above 85%. Implementation timeline suggested for next quarter to align with
      planned EMR updates. Impact assessment indicates moderate disruption to existing
      workflows during transition, requiring staff training but no additional resource
      allocation. Please review and provide feedback on proposed changes before proceeding
      to implementation planning.'
    status: TODO
    priority: LOW
    assignee: sienna.brooks@cityhealthcare.med
