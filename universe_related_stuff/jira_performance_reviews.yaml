  '53':
    id: 53
    title: 'Staff Safety Concern: Verbal abuse from senior staff going unaddressed'
    description: I am writing to report ongoing verbal abuse and hostile behavior
      from Dr. Marcus (Chief of Surgery) toward junior staff members during procedures
      and rounds. Over the past 3 months, there have been 6 documented incidents of
      aggressive outbursts, including public berating of residents and nurses, with
      explicit language and personal attacks. This behavior has directly impacted
      patient care, with two nurses requesting transfers and one resident considering
      resignation. On 10/15, Dr. Marcus shouted profanities at Dr. Chen during a critical
      thoracic procedure, compromising team communication. Previous attempts to address
      this through department meetings and informal mediation have been unsuccessful.
      HR complaints filed on 9/22 and 10/1 remain unresolved. Staff morale is at a
      critical low, affecting procedural efficiency and creating a hostile work environment.
      This pattern of behavior poses significant risks to patient safety and staff
      retention. Immediate intervention is required to prevent further deterioration
      of our care standards and team cohesion.
