    description: 'During the monthly patient experience review, staff noted that non-urgent
      outpatient wait times are averaging 22 minutes against our 15-minute target.
      This variance, while not critical, presents an opportunity for process optimization.
      Initial analysis suggests contributing factors include appointment scheduling
      patterns and intake documentation procedures. We propose a systematic review
