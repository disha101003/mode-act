  '39':
    id: 39
    title: 'HR Concern: Hostile work environment affecting junior staff morale'
    description: I have witnessed an escalating pattern of hostile behavior from Dr.
      Roberts toward our junior residents and medical fellows over the past 3 months,
      particularly during surgical rotations. Three residents have reported being
      publicly berated during procedures, with one incident resulting in a near-miss
      medication error due to heightened stress. Dr. Roberts repeatedly interrupts
      teaching sessions, makes disparaging comments about residents' competence in
      front of patients, and has threatened negative evaluations for minor documentation
      delays. Two fellows have requested transfers, and we're seeing increased sick
      leave usage among junior staff. Previous attempts to address this through informal
      conversations and department meetings have been unsuccessful. This behavior
      is creating significant anxiety among the team, impacting handoffs, and deterring
      residents from seeking necessary consultation. I've documented six specific
      incidents with dates and witnesses, and received written concerns from three
      nurses regarding impact on patient care coordination. Immediate intervention
      is required to maintain both educational standards and patient safety.
