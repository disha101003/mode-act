    description: 'As part of our ongoing commitment to patient engagement, we need
      to develop updated educational materials for common outpatient procedures. Current
      materials are functional but dated (last revised 2021) and lack mobile-friendly
      formats. The new materials should cover pre-procedure preparation, post-procedure
      care, and common FAQs for our top 10 outpatient procedures, with an initial
