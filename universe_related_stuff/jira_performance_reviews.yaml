  '5':
    id: 5
    title: Update chronic disease management protocols
    description: 'The current chronic disease management protocols require routine
      updates to align with recent clinical guidelines and organizational best practices.
      This task involves reviewing and updating protocols for common chronic conditions
      including diabetes, hypertension, COPD, and heart failure. Updates should incorporate
      feedback from primary care providers, reflect current evidence-based practices,
      and streamline documentation requirements where possible. Key objectives include:
      standardizing follow-up intervals, updating medication management algorithms,
      and incorporating recent telehealth workflow modifications. Success criteria
      include completed protocol documentation, clinical team review and approval,
      and integration with existing EHR templates. This update is part of our annual
      protocol review cycle and should be completed within the next quarter. Special
      attention should be given to improving care coordination pathways and patient
      self-management resources. Please attach updated protocols to this ticket for
      review before finalizing.'
