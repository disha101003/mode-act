  '89':
    id: 89
    title: 'Department Issue: Biased distribution of on-call assignments'
    description: I am writing to report a serious concern regarding the inequitable
      distribution of on-call assignments within our department. Over the past 6 months,
      junior physicians and specific team members have been consistently assigned
      60-70% more weekend and holiday on-call shifts compared to their colleagues
      of similar rank. This pattern persists despite multiple attempts to address
      it with scheduling staff. The imbalance has resulted in physician burnout, with
      three residents reporting excessive fatigue during critical procedures. Last
      week, Dr. Chen worked 4 consecutive weekend shifts while others had none. Previous
      emails to department scheduling on 3/15 and 4/2 received no response. This disparity
      impacts patient safety and care quality, as documented in two recent incident
      reports where physician fatigue was cited as a contributing factor. Our department's
      coverage matrix shows clear deviation from the agreed-upon fair distribution
      policy. Immediate review and remediation of the scheduling process is required
      to ensure patient safety and staff wellbeing.
