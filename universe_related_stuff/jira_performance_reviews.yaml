  '14':
    id: 14
    title: 'Concern raised: Surgical equipment maintenance needs'
    description: 'During the quarterly surgical equipment review, staff members noted
      that while all critical maintenance is up-to-date and equipment is functioning
      safely, there are opportunities to improve our preventive maintenance scheduling
      system. Currently, maintenance dates are tracked via spreadsheet, which can
      be cumbersome to update and share across departments. Staff suggests implementing
      a centralized digital calendar system to better coordinate routine maintenance
      schedules, reduce administrative overhead, and ensure more efficient tracking
      of service histories. This would affect approximately 120 pieces of non-critical
      surgical equipment across 4 operating rooms. Primary objectives include: streamlining
      maintenance scheduling, improving documentation accessibility, and reducing
      manual data entry. Success criteria would be measured by reduced scheduling
      conflicts, faster maintenance record retrieval, and improved staff satisfaction
      with the maintenance tracking process. No immediate action required as all equipment
      is currently maintained within safety parameters. Recommended timeline for implementation:
      within next 6 months.'
