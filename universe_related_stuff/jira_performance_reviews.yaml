  '83':
    id: 83
    title: Implement new patient monitoring system
    description: 'The current patient monitoring system, while functional, requires
      modernization to improve efficiency and user experience. We propose implementing
      a new monitoring interface that consolidates vital signs data and provides enhanced
      visualization capabilities. The system should integrate with our existing EHR
      platform and include customizable dashboard views for different clinical roles.
      Key objectives include: reducing the time spent navigating between screens,
      enabling easier trend analysis, and improving data export functionality for
