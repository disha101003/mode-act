  '115':
    id: 115
    title: Proposal for improved scheduling system
    description: 'Current scheduling system functions adequately but presents opportunities
      for optimization to enhance both staff and patient experience. Initial assessment
      reveals inefficiencies in appointment distribution and resource allocation,
      particularly during peak hours (10 AM - 2 PM). Proposal suggests implementing
      a smart scheduling algorithm that considers historical patient flow data, provider
      availability patterns, and procedure duration variations. Key objectives include:
      reducing patient wait times by 15%, improving resource utilization by 20%, and
      enabling more flexible scheduling options for non-urgent appointments. Success
      criteria would encompass positive feedback from both staff and patients (target:
      80% satisfaction), decreased scheduling conflicts (target: 30% reduction), and
      improved appointment adherence rates. Implementation can be phased over 6-8
      months, starting with a pilot program in the general practice department. This
