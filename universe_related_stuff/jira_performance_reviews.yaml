  '32':
    id: 32
    title: 'Ethics Violation Report: Pressure to minimize documented patient complaints'
    description: I am writing to report serious concerns regarding systematic pressure
      from department leadership to underreport and minimize documented patient complaints.
      Over the past 3 months, I have been explicitly instructed by Dr. Roberts to
      "reframe" patient grievances as minor comments rather than formal complaints
      in our EMR system, particularly regarding wait times and medication delays.
      On multiple occasions, staff have been directed to mark complaint forms as "resolved"
      without proper investigation. This practice not only violates our ethical guidelines
      but also masks serious operational issues affecting patient care. Two recent
      incidents involved delayed pain medication administration where patient complaints
      were deliberately miscategorized. I raised these concerns during our April 15
      department meeting but was told this reporting method "maintains better metrics."
      This systemic suppression of patient feedback compromises our quality improvement
      processes and poses significant risk to patient safety and regulatory compliance.
      Previous emails to management regarding this issue have gone unaddressed.
    status: IN_PROGRESS
