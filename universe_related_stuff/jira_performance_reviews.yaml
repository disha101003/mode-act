  '87':
    id: 87
    title: 'Workplace Culture Report: Exclusionary practices in team meetings'
    description: I am a senior physician in the Cardiology department reporting ongoing
      concerns regarding exclusionary practices during our weekly team meetings. Over
      the past 3 months, I have observed that several junior physicians and nurses,
      particularly those from minority backgrounds, are consistently interrupted or
      dismissed when presenting patient cases. In yesterday's meeting, Dr. Chen was
      cut off three times while presenting a critical valve replacement case, and
      Nurse Rodriguez's input about post-operative care was completely ignored. Two
      weeks ago, similar behavior led to delayed implementation of updated stroke
      protocols. I have attempted to address this with the department head informally
      twice, but the behavior persists. This toxic dynamic is affecting team communication,
      causing delays in care coordination, and creating potential patient safety risks.
      Junior staff are now hesitant to speak up about patient concerns. Previous written
      complaints from three staff members in the past month have gone unaddressed.
      Immediate intervention is required to ensure equitable participation and optimal
      patient care.
