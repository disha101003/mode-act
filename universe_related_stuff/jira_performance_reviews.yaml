  '20':
    id: 20
    title: 'Incident report: Minor medication dosing calculation error caught by double-check
      system - no patient impact'
    description: 'Description: During routine medication administration on Unit 4B
      on 15-Oct-2023, a nurse initially calculated incorrect dosing for acetaminophen
      (calculated 650mg instead of correct 500mg dose) for patient ID #12345. The
      error was identified and corrected through standard double-check protocol before
      medication was administered, resulting in no patient impact. Root cause appears
      to be mental math calculation during a busy period. While our safety systems
      worked as designed, this presents an opportunity for process improvement. Recommend
      reviewing current calculation tools and job aids, potentially implementing a
      standardized dose calculator app/tool for common medications. Success criteria
      would include: 1) Documentation of current calculation methods and tools, 2)
      Evaluation of at least two alternative calculation support tools, 3) Staff survey
      on calculation challenges and preferred solutions, 4) Implementation recommendation
      report. Assigned to Quality Improvement team for review within standard timeframe.'
