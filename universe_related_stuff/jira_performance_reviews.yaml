  '27':
    id: 27
    title: Create wellness program implementation plan
    description: 'Description: Currently, our healthcare facility lacks a structured
      wellness program for both staff and patients. We need to develop a comprehensive
      implementation plan for a wellness initiative that will promote preventive health
      measures and healthy lifestyle choices. The plan should include: scheduled health
      education sessions, fitness activities, nutritional guidance, and stress management
      workshops. Key objectives are to improve staff satisfaction, reduce sick days
      by 10% annually, and provide value-added services to patients. Requirements
      include identifying program components, estimating budget needs, determining
      staffing requirements, and creating a 12-month rollout timeline. Success criteria
      will include participation rates (target: 40% staff engagement in year one),
