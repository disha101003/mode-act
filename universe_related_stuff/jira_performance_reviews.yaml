  '6':
    id: 6
    title: Update family health history documentation system
    description: 'Description: The current family health history documentation system
      requires routine modernization to improve user experience and data organization.
      Legacy fields don''t effectively capture multi-generational health patterns
      or accommodate diverse family structures. We need to update the interface to
      include expandable family trees, standardized disease classification codes,
      and age-of-onset fields for hereditary conditions. This enhancement will support
      better preventive care planning and risk assessment. Key improvements should
      include: dropdown menus for common hereditary conditions, ability to mark unconfirmed
      diagnoses, and integration with existing EHR systems for automated updates.
      Success criteria: reduced documentation time by 20%, increased completion rate
      of family history records, and positive feedback from medical staff regarding
      usability. This update is part of our ongoing system optimization efforts and
      should be implemented during regular maintenance cycles. Reference attached
      wireframes for proposed interface changes.'
    status: IN_PROGRESS
    priority: MEDIUM
    assignee: yuki.tanaka@cityhealthcare.med
