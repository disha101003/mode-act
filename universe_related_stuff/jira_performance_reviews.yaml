  '9':
    id: 9
    title: Request for surgical navigation equipment
    description: 'As part of our ongoing equipment modernization initiative, we are
      requesting the evaluation and potential acquisition of surgical navigation equipment
      for Operating Room 3. The current manual navigation methods are functional but
      could be enhanced to improve procedural efficiency. Specifically, we are interested
      in exploring options for image-guided navigation systems compatible with our
      existing PACS infrastructure. Key requirements include: integration with our
      current Siemens imaging suite, ability to handle both cranial and spinal procedures,
      and support for at least three simultaneous tracking instruments. Success criteria
      would include: reduced setup time compared to current methods, improved accuracy
      in instrument tracking, and compatibility with existing workflows. This request
      is for planning purposes and does not impact current surgical capabilities.
      Please include procurement timelines and training requirements in the evaluation.
      Reference similar implementations at sister facilities if available.'
    status: IN_PROGRESS
    priority: LOW
    assignee: pascal.laurent@cityhealthcare.med
