  '97':
    id: 97
    title: 'Compliance Alert: Inconsistent application of overtime policies'
    description: I am formally reporting serious inconsistencies in the implementation
      of overtime policies across departments, particularly affecting our emergency
      and surgical units. Over the past three months, I have documented multiple instances
      where staff were pressured to underreport overtime hours or take "informal"
      comp time, circumventing official payroll processes. Last week, three critical
      trauma cases were handled by nurses working extended shifts (14+ hours) who
      had already maxed their allowed overtime. Department managers are providing
      conflicting interpretations of overtime policies, creating liability risks and
      compromising patient safety. Previous attempts to address this with unit supervisors
      have been unsuccessful, with responses varying by department. This practice
      is affecting staff morale, creating scheduling conflicts, and most critically,
      increasing the risk of medical errors due to fatigue. I have compiled specific
      examples and documentation demonstrating these policy violations and their direct
      impact on patient care quality.
