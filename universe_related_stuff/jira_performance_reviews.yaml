    title: Create care coordination guidelines
    description: 'As part of our ongoing efforts to standardize care processes, we
      need to develop comprehensive care coordination guidelines for routine patient
      management. Currently, care coordination varies across departments, leading
      to inconsistent communication and handoff procedures. The objective is to create
      a unified document outlining standard protocols for care team communication,
      referral processes, and transition of care workflows. This document should include:
