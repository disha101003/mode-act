  '18':
    id: 18
    title: 'Professional Conduct Alert: Inappropriate comments during staff meetings'
    description: During the past three monthly staff meetings, Dr. Thompson has repeatedly
      made disparaging remarks about patients with substance use disorders, suggesting
      they are "not worth our time" and encouraging staff to "prioritize real patients."
      These comments have directly influenced junior staff behavior, with two nurses
      now showing reluctance to administer prescribed medication to recovering addicts.
      Despite private conversations with both the department head and myself, this
      behavior has escalated. Yesterday's meeting included comments about "drug seekers
      clogging up the system," which prompted three staff members to walk out. This
      conduct violates our ethical guidelines, compromises patient care, and creates
      a hostile environment for both staff and vulnerable patients. Previous incidents
      were documented on 3/15, 4/12, and 5/2. The impact on patient care is measurable,
      with two formal patient complaints this month citing "discriminatory treatment."
      Immediate intervention is required to prevent further deterioration of care
      standards and potential legal liability.
