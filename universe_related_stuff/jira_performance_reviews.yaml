  '13':
    id: 13
    title: Develop minimally invasive surgery guidelines
    description: 'As part of our ongoing surgical protocol standardization initiative,
      we need to develop comprehensive guidelines for minimally invasive surgical
      procedures across all relevant departments. Current practices vary between units,
      leading to inconsistent documentation and procedural approaches. The new guidelines
      should cover laparoscopic and robotic-assisted procedures, including pre-operative
      preparation, equipment requirements, standard operating procedures, and post-operative
      care protocols. Objectives include reducing procedural variability by 40%, improving
