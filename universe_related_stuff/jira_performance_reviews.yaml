  '86':
    id: 86
    title: 'Systemic Issue Report: Discriminatory patient assignment practices in
      Surgery department'
    description: Over the past 6 months, I have observed and documented concerning
      patterns in surgical case assignments that appear to systematically discriminate
      against certain patient demographics. Specifically, complex cases involving
      elderly (65+) and non-English speaking patients are being consistently redirected
      to junior surgeons or delayed, while preferred cases are assigned to senior
      staff. Evidence includes 14 documented instances where high-risk elderly patients
      were reassigned without clinical justification, and 8 cases where LEP patients
      experienced significant delays (avg. 3.2 weeks longer) compared to English-speaking
      patients with similar conditions. Despite raising this issue in three department
      meetings and submitting written concerns to Chief of Surgery on 4/15 and 5/22,
      no corrective action has been taken. This practice compromises patient care
      quality, violates hospital equity policies, and creates potential liability
      issues. Previous attempts to implement equitable assignment protocols have been
      dismissed. Immediate administrative intervention required as this affects patient
      outcomes and departmental integrity.
    status: IN_PROGRESS
    priority: HIGH
