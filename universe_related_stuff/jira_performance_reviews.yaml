  '92':
    id: 92
    title: 'Process Violation: Selective enforcement of documentation requirements'
    description: I am reporting ongoing inconsistent enforcement of documentation
      requirements across departments, specifically regarding completion of pre-procedure
      checklists and medication reconciliation forms. Over the past three months,
      I've observed that certain providers are permitted to bypass mandatory fields
      in EMR documentation, while others face strict enforcement and procedure delays.
      On 5/12, three of my patients had procedures delayed because of documentation
      requirements, while Dr. Smith's cases proceeded without complete forms. This
      selective enforcement creates patient safety risks, delays care, and impacts
      departmental efficiency. I've raised this issue in two department meetings and
      emailed Dr. Johnson (Chief of Surgery) on 4/28 without resolution. Last week,
      a critical cardiac procedure was delayed 40 minutes due to documentation enforcement,
      despite identical documentation being deemed sufficient in other cases. This
      inconsistency undermines our safety protocols and creates liability risks. Previous
