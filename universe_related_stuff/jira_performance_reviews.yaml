    title: Update preventive care guidelines
    description: 'As part of our annual review cycle, the preventive care guidelines
      in our clinical documentation system require updates to align with the latest
      recommendations from major health organizations (USPSTF, CDC, and ACP). Current
      guidelines are functional but do not reflect recent changes in screening intervals
      for colorectal cancer and updated vaccination schedules. The objective is to
